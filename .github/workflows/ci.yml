name: Continuous Integration

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

# Main and release runs are never interrupted halfway through a publication.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')) }}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  IMAGE_NAME: ghcr.io/heisernbergg0942/devops-project
  CI_IMAGE: devops-demo:ci

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.release.outputs.version }}
      image-id: ${{ steps.build.outputs.image-id }}
      image-artifact: tested-image-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      TEST_CONTAINER: devops-demo-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # Release commits must be reachable from main.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint application and CI scripts
        run: npm run lint

      - name: Run automated tests
        run: npm test

      - name: Validate release eligibility
        id: release
        run: node scripts/ci/release-policy.js

      - name: Build Docker image once
        id: build
        run: |
          docker build --pull --tag "$CI_IMAGE" .
          image_id="$(docker image inspect --format '{{.Id}}' "$CI_IMAGE")"
          printf 'image-id=%s\n' "$image_id" >> "$GITHUB_OUTPUT"

      - name: Start test container
        run: docker run --detach --name "$TEST_CONTAINER" --publish 127.0.0.1::3000 "$CI_IMAGE"

      - name: Verify application responses and Docker health
        timeout-minutes: 2
        run: |
          endpoint="$(docker port "$TEST_CONTAINER" 3000/tcp)"
          APP_URL="http://$endpoint" npm run test:smoke
          for attempt in {1..20}; do
            health="$(docker inspect --format '{{.State.Health.Status}}' "$TEST_CONTAINER")"
            printf 'Docker health check %s/20: %s\n' "$attempt" "$health"
            if [[ "$health" == healthy ]]; then exit 0; fi
            if [[ "$health" == unhealthy ]]; then break; fi
            sleep 1
          done
          echo '::error::Container did not become healthy'
          exit 1

      - name: Install pinned Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2
          cache: false

      - name: Scan the tested image
        timeout-minutes: 7
        run: |
          mkdir -p reports
          trivy --version
          trivy image --config trivy.yaml --image-src docker "$CI_IMAGE" 2>&1 | tee reports/trivy.txt

      - name: Collect container diagnostics
        if: always()
        run: |
          mkdir -p reports
          if docker container inspect "$TEST_CONTAINER" > reports/container-inspect.json 2> reports/container-inspect-error.log; then
            docker logs --timestamps "$TEST_CONTAINER" 2>&1 | tee reports/container.log
          else
            echo 'No test container was created; see earlier step failures.'
          fi

      - name: Clean up test container
        if: always()
        run: |
          if docker container inspect "$TEST_CONTAINER" > /dev/null 2>&1; then
            docker rm --force "$TEST_CONTAINER"
          fi

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          retention-days: 7
          if-no-files-found: error

      - name: Export successfully tested image
        if: success() && steps.release.outputs.publish == 'true'
        run: |
          docker save "$CI_IMAGE" --output image.tar
          sha256sum image.tar > image.tar.sha256

      - name: Upload tested image
        if: success() && steps.release.outputs.publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            image.tar
            image.tar.sha256
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build-and-test
    if: needs.build-and-test.outputs.publish == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    # Serializes main AND release-tag publishing; GitHub does not guarantee FIFO.
    concurrency:
      group: ghcr-production-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - name: Checkout trusted publishing helpers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Download tested image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build-and-test.outputs.image-artifact }}

      - name: Verify and load the exact tested image
        env:
          EXPECTED_IMAGE_ID: ${{ needs.build-and-test.outputs.image-id }}
        run: |
          sha256sum --check image.tar.sha256
          docker load --input image.tar
          actual_id="$(docker image inspect --format '{{.Id}}' "$CI_IMAGE")"
          if [[ "$actual_id" != "$EXPECTED_IMAGE_ID" ]]; then
            echo '::error::Loaded image differs from the tested image'
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish commit and optional release tags
        env:
          VERSION_TAG: ${{ needs.build-and-test.outputs.version }}
        run: |
          docker tag "$CI_IMAGE" "$IMAGE_NAME:$GITHUB_SHA"
          docker push "$IMAGE_NAME:$GITHUB_SHA"
          if [[ -n "$VERSION_TAG" ]]; then
            docker tag "$CI_IMAGE" "$IMAGE_NAME:$VERSION_TAG"
            docker push "$IMAGE_NAME:$VERSION_TAG"
          fi

      - name: Check current main before updating latest
        id: promotion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/check-latest.js

      - name: Promote current main to latest
        if: steps.promotion.outputs.latest == 'true'
        run: |
          docker tag "$CI_IMAGE" "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:latest"
