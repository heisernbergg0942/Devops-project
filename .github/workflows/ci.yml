
name: Continuous Integration

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/heisernbergg0942/devops-project

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-demo:ci .

      - name: Run Docker container
        run: |
          docker run -d \
            --name devops-demo \
            -p 3000:3000 \
            devops-demo:ci

      - name: Test application
        run: |
          curl --fail --retry 10 \
            --retry-all-errors \
            --retry-delay 3 \
            --connect-timeout 5 \
            --max-time 10 \
            http://127.0.0.1:3000/health

      - name: Show container logs
        if: always()
        run: docker logs devops-demo || true

      - name: Cleanup container
        if: always()
        run: docker rm -f devops-demo || true

      - name: Export tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save devops-demo:ci -o image.tar

      - name: Upload tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: tested-image
          path: image.tar
          retention-days: 1

  publish:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download tested image
        uses: actions/download-artifact@v4
        with:
          name: tested-image

      - name: Load Docker image
        run: docker load -i image.tar

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker image
        run: |
          docker tag devops-demo:ci $IMAGE_NAME:latest
          docker tag devops-demo:ci $IMAGE_NAME:$GITHUB_SHA

      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:$GITHUB_SHA
